<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch with Your Company." />
  <title>Contact | Eternity Customz</title>
  <link rel="icon" type="image/png" href="./images/eternityEBlack.png" />
  <link rel="stylesheet" href="css/global-var.css" />
  <link rel="stylesheet" href="css/header.styles.css" />
  <link rel="stylesheet" href="css/footer.styles.css" />
  <link rel="stylesheet" href="css/contact.styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <!-- Include the header -->
  <header  id="header-placeholder"></header>
  
  <main>
    <section class="contact-hero container">
      <h1 class="contact-eyebrow">Contact</h1>
      <p class="contact-title">Get in touch</p>
      <p class="contact-sub">Have a question or concern? Reach out about anything — builds, pricing, timelines or care tips. Our team is happy to help and will get back to you shortly.</p>
    </section>

    <section class="container content">
      <form id="contact-form" class="contact-form" novalidate>
        <section class="contact-section">
          <div class="details-grid">
            <input class="contact-input" id="name" name="name" placeholder="Full name" autocomplete="name" required />
            <input type="email" class="contact-input" id="email" name="email" placeholder="Email" autocomplete="email" required />
          </div>
          <textarea class="contact-input contact-textarea" id="message" name="message" placeholder="How can we help?" required></textarea>
        </section>
        <div class="g-recaptcha" data-sitekey="6LfWkv0tAAAAACvCSwXLrNxUebXW_fSq1jkX3SzL"></div>
        <button type="submit" class="contact-submit">Send Message</button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <footer id="footer-placeholder"></footer>

  <script src="js/main.js"></script>
</body>
</html>
